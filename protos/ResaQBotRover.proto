# tags: static
# ResQBot AI — Custom 4WD Off-Road Autonomous Disaster Search & Rescue Rover (85 mm Big-Wheel Upgrade)
#
# Mechanical Design Summary (ENU: +X Forward, +Y Left, +Z Up):
#   - Wheel radius       : 0.085 m (85 mm big off-road tire, width 0.052 m)
#   - Wheelbase (X)      : 0.300 m (front axle +0.150 m, rear axle -0.150 m)
#   - Track width (Y)    : 0.360 m (left wheels +0.180 m, right wheels -0.180 m)
#   - Total outer width  : 0.412 m (clears narrow disaster breaches >= 1.5 m)
#   - Ground clearance   : 0.068 m (chassis belly Z=0.068 m, axle Z=0.085 m)
#   - Total mass         : ~7.6 kg (chassis 5.0 kg + 4 x 0.65 kg wheels, low CoG at Z~0.110 m)
#
# NOTE: Update your controller kinematics config to match:
#   WHEEL_RADIUS = 0.085 m, TRACK_WIDTH = 0.360 m, WHEELBASE = 0.300 m
#
# Device Names (must match controllers/resqbot_ai/robot_config.py or config.py):
#   Motors (4)           : front_left_motor, front_right_motor,
#                          rear_left_motor, rear_right_motor
#   Encoders (4)         : front_left_encoder, front_right_encoder,
#                          rear_left_encoder, rear_right_encoder
#   LiDAR (1)            : lidar (360 deg, 0 deg = +X forward, Z = 0.280 m)
#   RGB Camera (1)       : rgb_camera (320x240, unobstructed at X=+0.215, Z=0.214)
#   Distance Sensors (5) : front_left_ds, front_center_ds, front_right_ds,
#                          rear_left_ds, rear_right_ds (low-mounted Z=0.065 m / 0.075 m)
#   IMU (2)              : imu_accel, imu_gyro
#   Sensor Receiver (1)  : env_sensor_rx (channel 1; receives simulated local
#                          MLX90640 thermal & MQ-2 gas observations from supervisor)

PROTO ResQBotRover [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "ResQBot_AI"
  field SFString   controller      "resqbot_ai"
  field MFString   controllerArgs  []
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # ========================================================================
      # 1. RUGGED LOWER CHASSIS & PROTECTIVE ELECTRONICS ENCLOSURE
      #    Belly at Z = 0.068 m -> top of main hull at Z = 0.168 m
      # ========================================================================
      DEF CHASSIS_MAIN Pose {
        translation 0 0 0.118
        children [
          Shape {
            appearance DEF CHASSIS_DARK_GREY PBRAppearance {
              baseColor 0.18 0.20 0.23
              roughness 0.55
              metalness 0.35
            }
            geometry Box {
              size 0.40 0.26 0.10
            }
          }
        ]
      }
      # Upper sloped protective electronics lid (Raspberry Pi 4 + ESP32 bay)
      DEF CHASSIS_TOP_DECK Pose {
        translation -0.01 0 0.180
        children [
          Shape {
            appearance DEF RESCUE_ORANGE PBRAppearance {
              baseColor 0.92 0.36 0.07
              roughness 0.42
              metalness 0.15
            }
            geometry Box {
              size 0.32 0.22 0.026
            }
          }
        ]
      }
      # High-visibility rescue orange side armor rails
      Pose {
        translation 0 0.136 0.135
        children [
          Shape {
            appearance USE RESCUE_ORANGE
            geometry Box {
              size 0.34 0.016 0.032
            }
          }
        ]
      }
      Pose {
        translation 0 -0.136 0.135
        children [
          Shape {
            appearance USE RESCUE_ORANGE
            geometry Box {
              size 0.34 0.016 0.032
            }
          }
        ]
      }
      # Heavy-duty angled front skid plate & protective bumper
      DEF FRONT_BUMPER Pose {
        translation 0.214 0 0.092
        children [
          Shape {
            appearance DEF BUMPER_METAL PBRAppearance {
              baseColor 0.12 0.13 0.15
              roughness 0.48
              metalness 0.65
            }
            geometry Box {
              size 0.028 0.28 0.044
            }
          }
        ]
      }
      # Orange bumper accent strip
      Pose {
        translation 0.229 0 0.102
        children [
          Shape {
            appearance USE RESCUE_ORANGE
            geometry Box {
              size 0.005 0.24 0.014
            }
          }
        ]
      }
      # Rear protective bumper
      Pose {
        translation -0.210 0 0.094
        children [
          Shape {
            appearance USE BUMPER_METAL
            geometry Box {
              size 0.022 0.25 0.040
            }
          }
        ]
      }

      # ========================================================================
      # 2. SENSOR MAST, ROLL CAGE & DEDICATED SENSOR HOUSINGS
      # ========================================================================
      # Vertical mast stanchions supporting LiDAR platform
      Pose {
        translation 0.04 0.07 0.220
        children [
          Shape {
            appearance USE BUMPER_METAL
            geometry Cylinder { height 0.070 radius 0.010 subdivision 10 }
          }
        ]
      }
      Pose {
        translation 0.04 -0.07 0.220
        children [
          Shape {
            appearance USE BUMPER_METAL
            geometry Cylinder { height 0.070 radius 0.010 subdivision 10 }
          }
        ]
      }
      # LiDAR mounting deck plate
      Pose {
        translation 0.04 0 0.256
        children [
          Shape {
            appearance USE CHASSIS_DARK_GREY
            geometry Cylinder { height 0.010 radius 0.068 subdivision 18 }
          }
        ]
      }
      # Front RGB + MLX90640 Thermal camera dual-sensor pod (unobstructed)
      Pose {
        translation 0.185 0 0.214
        children [
          Shape {
            appearance USE CHASSIS_DARK_GREY
            geometry Box { size 0.055 0.120 0.046 }
          }
        ]
      }
      # Thermal camera (MLX90640) visual lens housing next to RGB camera
      Pose {
        translation 0.214 -0.032 0.214
        rotation 0 1 0 1.570796
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.15 0.12 0.10
              roughness 0.25
              metalness 0.85
            }
            geometry Cylinder { height 0.010 radius 0.012 subdivision 12 }
          }
        ]
      }
      # Gas sensor (MQ-2) ventilated cylindrical housing on rear-left deck
      Pose {
        translation -0.115 0.072 0.212
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.72 0.74 0.76
              roughness 0.35
              metalness 0.75
            }
            geometry Cylinder { height 0.038 radius 0.018 subdivision 14 }
          }
        ]
      }
      # Emergency amber strobe beacon on rear-right deck (visual indicator)
      Pose {
        translation -0.115 -0.072 0.210
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1.0 0.55 0.05
              roughness 0.25
              metalness 0.0
              emissiveColor 1.0 0.45 0.02
              emissiveIntensity 1.4
            }
            geometry Cylinder { height 0.032 radius 0.016 subdivision 12 }
          }
        ]
      }

      # ========================================================================
      # 3. SENSORS (EXACT NAMES MATCHED TO CONTROLLER)
      # ========================================================================

      # --- A. 360-degree 2D LiDAR (0 deg aligned with +X forward!) ---
      Lidar {
        translation 0.04 0 0.280
        rotation 0 0 1 0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.08 0.09 0.11
              roughness 0.35
              metalness 0.40
            }
            geometry Cylinder { height 0.038 radius 0.036 subdivision 18 }
          }
        ]
        name "lidar"
        horizontalResolution 360
        fieldOfView 6.2831853
        verticalFieldOfView 0.05
        numberOfLayers 1
        near 0.08
        minRange 0.12
        maxRange 12.0
        noise 0.008
      }

      # --- B. Forward-Facing RGB Camera (320x240, ~63 deg HFOV, aligned with thermal) ---
      Camera {
        translation 0.215 0.022 0.214
        rotation 0 0 1 0
        children [
          Pose {
            rotation 0 1 0 1.570796
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.05 0.05 0.06
                  roughness 0.20
                  metalness 0.60
                }
                geometry Cylinder { height 0.010 radius 0.013 subdivision 12 }
              }
            ]
          }
        ]
        name "rgb_camera"
        fieldOfView 1.10
        width 320
        height 240
        near 0.05
        far 25.0
      }

      # --- C. Low-Mounted Front & Rear Distance Sensors (catches low rubble & road lips) ---
      # Mounted at Z=0.065 m (below LiDAR plane, clear of bumper & 85 mm wheels)
      DistanceSensor {
        translation 0.232 0.0 0.065
        rotation 0 0 1 0
        name "front_center_ds"
        lookupTable [
          0.02 0.02 0.004
          1.50 1.50 0.012
        ]
        type "infra-red"
        numberOfRays 3
        aperture 0.08
      }
      DistanceSensor {
        translation 0.226 0.095 0.065
        rotation 0 0 1 0.18
        name "front_left_ds"
        lookupTable [
          0.02 0.02 0.004
          1.50 1.50 0.012
        ]
        type "infra-red"
        numberOfRays 3
        aperture 0.08
      }
      DistanceSensor {
        translation 0.226 -0.095 0.065
        rotation 0 0 1 -0.18
        name "front_right_ds"
        lookupTable [
          0.02 0.02 0.004
          1.50 1.50 0.012
        ]
        type "infra-red"
        numberOfRays 3
        aperture 0.08
      }
      DistanceSensor {
        translation -0.222 0.088 0.075
        rotation 0 0 1 2.98
        name "rear_left_ds"
        lookupTable [
          0.02 0.02 0.004
          1.50 1.50 0.012
        ]
        type "infra-red"
        numberOfRays 3
        aperture 0.08
      }
      DistanceSensor {
        translation -0.222 -0.088 0.075
        rotation 0 0 1 -2.98
        name "rear_right_ds"
        lookupTable [
          0.02 0.02 0.004
          1.50 1.50 0.012
        ]
        type "infra-red"
        numberOfRays 3
        aperture 0.08
      }

      # --- D. IMU (Accelerometer + Gyroscope) ---
      Accelerometer {
        translation 0 0 0.125
        name "imu_accel"
      }
      Gyro {
        translation 0 0 0.125
        name "imu_gyro"
      }

      # --- E. Sensor Channel Receiver (receives simulated thermal & gas packets only) ---
      Receiver {
        name "env_sensor_rx"
        channel 1
      }

      # ========================================================================
      # 4. FOUR INDEPENDENT 85mm BIG OFF-ROAD WHEELS (HingeJoint + Motor + Encoder)
      #    Axle Z = 0.085 m, Wheel radius = 0.085 m -> tire bottom at Z = 0.000 m
      # ========================================================================

      # --- Front-Left Wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.150 0.180 0.085
        }
        device [
          RotationalMotor {
            name "front_left_motor"
            maxVelocity 12.0
            maxTorque 11.5
          }
          PositionSensor {
            name "front_left_encoder"
          }
        ]
        endPoint Solid {
          translation 0.150 0.180 0.085
          rotation 1 0 0 1.570796
          children [
            DEF WHEEL_TIRE_SHAPE Shape {
              appearance DEF TIRE_RUBBER PBRAppearance {
                baseColor 0.09 0.09 0.10
                roughness 0.90
                metalness 0.05
              }
              geometry DEF WHEEL_GEOM Cylinder {
                height 0.052
                radius 0.085
                subdivision 28
              }
            }
            DEF WHEEL_HUB_SHAPE Shape {
              appearance USE RESCUE_ORANGE
              geometry Cylinder {
                height 0.055
                radius 0.040
                subdivision 16
              }
            }
          ]
          name "front_left_wheel"
          boundingObject USE WHEEL_GEOM
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }

      # --- Front-Right Wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.150 -0.180 0.085
        }
        device [
          RotationalMotor {
            name "front_right_motor"
            maxVelocity 12.0
            maxTorque 11.5
          }
          PositionSensor {
            name "front_right_encoder"
          }
        ]
        endPoint Solid {
          translation 0.150 -0.180 0.085
          rotation 1 0 0 1.570796
          children [
            USE WHEEL_TIRE_SHAPE
            USE WHEEL_HUB_SHAPE
          ]
          name "front_right_wheel"
          boundingObject USE WHEEL_GEOM
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }

      # --- Rear-Left Wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.150 0.180 0.085
        }
        device [
          RotationalMotor {
            name "rear_left_motor"
            maxVelocity 12.0
            maxTorque 11.5
          }
          PositionSensor {
            name "rear_left_encoder"
          }
        ]
        endPoint Solid {
          translation -0.150 0.180 0.085
          rotation 1 0 0 1.570796
          children [
            USE WHEEL_TIRE_SHAPE
            USE WHEEL_HUB_SHAPE
          ]
          name "rear_left_wheel"
          boundingObject USE WHEEL_GEOM
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }

      # --- Rear-Right Wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.150 -0.180 0.085
        }
        device [
          RotationalMotor {
            name "rear_right_motor"
            maxVelocity 12.0
            maxTorque 11.5
          }
          PositionSensor {
            name "rear_right_encoder"
          }
        ]
        endPoint Solid {
          translation -0.150 -0.180 0.085
          rotation 1 0 0 1.570796
          children [
            USE WHEEL_TIRE_SHAPE
            USE WHEEL_HUB_SHAPE
          ]
          name "rear_right_wheel"
          boundingObject USE WHEEL_GEOM
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }
    ]

    # Compound chassis collision boundingObject (exact ground clearance Z >= 0.068 m)
    boundingObject Group {
      children [
        Pose {
          translation 0 0 0.118
          children [ Box { size 0.40 0.26 0.10 } ]
        }
        Pose {
          translation 0.214 0 0.092
          children [ Box { size 0.028 0.28 0.044 } ]
        }
        Pose {
          translation -0.210 0 0.094
          children [ Box { size 0.022 0.25 0.040 } ]
        }
        Pose {
          translation 0.04 0 0.240
          children [ Cylinder { height 0.12 radius 0.075 } ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 5.0
      centerOfMass [ 0 0 0.110 ]
    }
  }
}
